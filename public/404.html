<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loading…</title>
    <script>
      (function () {
        var path = location.pathname || '/'
        // Nested Slyvr SPA: GitHub Pages serves this root 404 for missing paths.
        // Keep the original /slyvr/... URL and boot Slyvr's shell so React Router can resolve it.
        if (path === '/slyvr' || path.indexOf('/slyvr/') === 0) {
          fetch('/slyvr/index.html', { credentials: 'same-origin' })
            .then(function (response) {
              if (!response.ok) throw new Error('Slyvr shell unavailable')
              return response.text()
            })
            .then(function (html) {
              document.open()
              document.write(html)
              document.close()
            })
            .catch(function () {
              location.replace('/slyvr/')
            })
          return
        }

        // Portfolio uses hash routes; unknown top-level paths fall back to home.
        location.replace('/' + location.search + location.hash)
      })()
    </script>
  </head>
  <body></body>
</html>
