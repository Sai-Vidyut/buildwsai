<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loading…</title>
    <script>
      (function () {
        var path = location.pathname || '/'
        var search = location.search || ''
        var hash = location.hash || ''

        // Nested Slyvr SPA: GitHub Pages serves this root 404 for missing paths
        // such as /slyvr/login. Do not rewrite the document in-place (module
        // scripts often fail to boot that way in Safari). Store the deep link,
        // then load the real /slyvr/ index (HTTP 200). Nested index.html restores
        // the path via history.replaceState before React boots.
        if (path === '/slyvr' || path.indexOf('/slyvr/') === 0) {
          try {
            sessionStorage.setItem('slyvr-spa-path', path + search + hash)
          } catch (e) {}
          location.replace('/slyvr/' + search + hash)
          return
        }

        // Portfolio uses hash routes; unknown top-level paths fall back to home.
        location.replace('/' + search + hash)
      })()
    </script>
  </head>
  <body></body>
</html>
