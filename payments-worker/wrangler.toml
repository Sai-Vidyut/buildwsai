name = "invoice-pack-payments"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = true

[vars]
ALLOWED_ORIGINS = "https://buildwsai.online,https://www.buildwsai.online"
EMAIL_FROM = "reminders@buildwsai.online"

[triggers]
crons = ["*/15 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "invoice-pack-payments"
database_id = "63f02ab3-fbcc-4b92-b2b1-078a1af40099"
migrations_dir = "migrations"

[[ratelimits]]
name = "ORDER_LIMITER"
namespace_id = "4901"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "VERIFY_LIMITER"
namespace_id = "4902"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "ADMIN_LIMITER"
namespace_id = "4903"
simple = { limit = 10, period = 60 }

[observability]
enabled = true
