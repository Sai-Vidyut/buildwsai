name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [slyvr-updated]
  # Secret-free backup: pick up Slyvr/main changes even when no dispatch token is configured.
  # Skips the heavy build when the Slyvr tip SHA was already nested (see "gate" job).
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.decide.outputs.should_deploy }}
      slyvr_tip_sha: ${{ steps.tip.outputs.sha }}
      requested_sha: ${{ steps.tip.outputs.requested_sha }}
    steps:
      - name: Resolve Slyvr tip / requested SHA
        id: tip
        run: |
          set -euo pipefail
          TIP="$(curl -fsSL https://api.github.com/repos/Sai-Vidyut/slyvr/commits/main | jq -r .sha)"
          if [ -z "$TIP" ] || [ "$TIP" = "null" ]; then
            echo "Failed to resolve Slyvr main tip SHA" >&2
            exit 1
          fi
          echo "sha=$TIP" >> "$GITHUB_OUTPUT"

          REQUESTED="${{ github.event.client_payload.sha }}"
          if [ -n "$REQUESTED" ]; then
            echo "requested_sha=$REQUESTED" >> "$GITHUB_OUTPUT"
          else
            echo "requested_sha=" >> "$GITHUB_OUTPUT"
          fi
          echo "Slyvr main tip: $TIP"
          echo "Requested payload SHA: ${REQUESTED:-"(none — will checkout main)"}"

      - name: Cache marker for already-nested Slyvr SHA
        id: cache
        uses: actions/cache@v4
        with:
          path: .slyvr-nested-marker
          key: slyvr-nested-${{ steps.tip.outputs.sha }}

      - name: Decide whether to deploy
        id: decide
        run: |
          set -euo pipefail
          EVENT="${{ github.event_name }}"
          CACHE_HIT="${{ steps.cache.outputs.cache-hit }}"

          # Always deploy for portfolio pushes, manual runs, and Slyvr dispatch events.
          if [ "$EVENT" != "schedule" ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "Deploying (event=$EVENT)"
            exit 0
          fi

          if [ "$CACHE_HIT" = "true" ]; then
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "Skipping scheduled deploy — Slyvr ${{ steps.tip.outputs.sha }} already nested."
          else
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "Scheduled deploy — new Slyvr tip ${{ steps.tip.outputs.sha }}"
          fi

  build:
    needs: gate
    if: needs.gate.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout portfolio
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install portfolio dependencies
        run: npm ci

      - name: Build portfolio
        run: npm run build

      - name: Checkout Slyvr (public, temporary CI directory)
        uses: actions/checkout@v4
        with:
          repository: Sai-Vidyut/slyvr
          # Prefer the dispatch payload SHA when present; otherwise latest main.
          ref: ${{ needs.gate.outputs.requested_sha != '' && needs.gate.outputs.requested_sha || 'main' }}
          path: .slyvr-src

      - name: Verify nested Slyvr commit
        id: slyvr_verify
        run: |
          set -euo pipefail
          ACTUAL="$(git -C .slyvr-src rev-parse HEAD)"
          TIP="${{ needs.gate.outputs.slyvr_tip_sha }}"
          REQUESTED="${{ needs.gate.outputs.requested_sha }}"

          echo "nested_sha=$ACTUAL" >> "$GITHUB_OUTPUT"
          echo "Nested Slyvr commit: $(git -C .slyvr-src log -1 --oneline)"
          echo "Nested SHA:     $ACTUAL"
          echo "Slyvr main tip: $TIP"
          echo "Requested SHA:  ${REQUESTED:-"(none)"}"

          if [ -n "$REQUESTED" ] && [ "$ACTUAL" != "$REQUESTED" ]; then
            echo "ERROR: repository_dispatch requested $REQUESTED but checkout resolved $ACTUAL" >&2
            exit 1
          fi

          if [ -z "$REQUESTED" ] && [ "$ACTUAL" != "$TIP" ]; then
            echo "ERROR: checked out Slyvr $ACTUAL but Slyvr main tip is $TIP" >&2
            exit 1
          fi

      - name: Setup Node for Slyvr
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .slyvr-src/frontend/package-lock.json

      # Vite inlines import.meta.env.VITE_* at build time. Names match Slyvr
      # frontend/.env.example (VITE_API_URL, VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY).
      # Configure these as repository Actions secrets on Sai-Vidyut/buildwsai.
      - name: Install and build Slyvr frontend
        working-directory: .slyvr-src/frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          npm ci
          npm run build

      - name: Nest Slyvr production build into dist/slyvr
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/404.html
          test -f .slyvr-src/frontend/dist/index.html

          # Portfolio 404 must use the Safari-safe sessionStorage redirect (not in-place document rewrite).
          if grep -E 'document\.(write|open)\(' dist/404.html; then
            echo "dist/404.html still rewrites the document in-place — refusing to publish" >&2
            exit 1
          fi
          grep -q 'slyvr-spa-path' dist/404.html
          grep -q "location.replace('/slyvr/'" dist/404.html

          rm -rf dist/slyvr
          mkdir -p dist/slyvr
          cp -R .slyvr-src/frontend/dist/. dist/slyvr/

          # Inject path-restore into the nested shell so /slyvr/login survives the
          # root 404 → /slyvr/ redirect without modifying Slyvr source.
          # Runs synchronously in <head> before the module bundle so React Router
          # sees the original deep link via history.replaceState.
          python3 <<'PY'
          from pathlib import Path

          marker = "slyvr-spa-path"
          snippet = (
              "<script>"
              "(function(){try{"
              f'var k="{marker}";'
              "var p=sessionStorage.getItem(k);"
              "if(!p)return;"
              "sessionStorage.removeItem(k);"
              'if(p.indexOf("/slyvr")!==0)return;'
              "var cur=location.pathname+location.search+location.hash;"
              'if(p!==cur)history.replaceState(null,"",p);'
              "}catch(e){}})();"
              "</script>"
          )

          for name in ("index.html", "404.html"):
              path = Path("dist/slyvr") / name
              if not path.is_file():
                  continue
              text = path.read_text(encoding="utf-8")
              if marker in text:
                  continue
              if "<head>" not in text:
                  raise SystemExit(f"{path}: missing <head>; cannot inject SPA restore")
              path.write_text(text.replace("<head>", "<head>\n    " + snippet, 1), encoding="utf-8")
              print(f"Injected SPA path restore into {path}")
          PY

          # Record the exact Slyvr commit published under /slyvr/
          NESTED_SHA="$(git -C .slyvr-src rev-parse HEAD)"
          printf '%s\n' "$NESTED_SHA" > dist/slyvr/.slyvr-commit
          git -C .slyvr-src log -1 --format='%H%n%an <%ae>%n%s%n%ci' > dist/slyvr/.slyvr-commit.txt

          # Hard fail if secrets/env ever appear in the published shell
          if find dist/slyvr -type f \( -name '.env' -o -name '.env.*' -o -name '*.sqlite' -o -name '*.db' \) | grep -q .; then
            echo "Refusing to publish env/database files under dist/slyvr" >&2
            find dist/slyvr -type f \( -name '.env' -o -name '.env.*' -o -name '*.sqlite' -o -name '*.db' \) >&2
            exit 1
          fi

          test -f dist/slyvr/index.html
          grep -E '(/slyvr/|base href="/slyvr/)' dist/slyvr/index.html >/dev/null
          grep -q 'slyvr-spa-path' dist/slyvr/index.html
          test -d dist/slyvr/assets
          test -f dist/slyvr/.slyvr-commit

          # Ensure portfolio root assets were not overwritten by a flat Slyvr copy
          test -f dist/index.html
          test -f dist/CNAME
          if ls dist/assets/Dashboard-* >/dev/null 2>&1; then
            echo "Slyvr Dashboard chunk leaked into portfolio dist/assets" >&2
            exit 1
          fi
          if ls dist/assets/geist-* >/dev/null 2>&1; then
            echo "Slyvr font assets leaked into portfolio dist/assets" >&2
            exit 1
          fi
          test -d dist/slyvr/assets
          ls dist/slyvr/assets/index-*.js >/dev/null
          ls dist/assets/index-*.js >/dev/null

          echo "Combined dist layout:"
          find dist -maxdepth 2 -type f -o -type d | sort | head -80
          echo "Published Slyvr commit file:"
          cat dist/slyvr/.slyvr-commit.txt
          echo "Nested index head (path restore + asset URLs):"
          head -n 20 dist/slyvr/index.html

      - name: Mark Slyvr SHA as nested (for schedule skip)
        run: |
          set -euo pipefail
          mkdir -p .slyvr-nested-marker
          printf '%s\n' "${{ steps.slyvr_verify.outputs.nested_sha }}" > .slyvr-nested-marker/sha

      - name: Persist nested-SHA cache marker
        uses: actions/cache/save@v4
        with:
          path: .slyvr-nested-marker
          key: slyvr-nested-${{ steps.slyvr_verify.outputs.nested_sha }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: [gate, build]
    if: needs.gate.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
