            - list [ref=f29e1373]:
              - listitem [ref=f29e1374]: Filing on the GST portal, an IRN, or an e-invoice QR code.
              - listitem [ref=f29e1375]: Tax or legal advice. Confirm registration, SAC, rate, and export rules before you send the draft.
              - listitem [ref=f29e1376]: Anyone chasing the client for you.
              - listitem [ref=f29e1377]: An automatic confirmation that ₹499 was received. A UTR saved here is payment pending, not proof.
