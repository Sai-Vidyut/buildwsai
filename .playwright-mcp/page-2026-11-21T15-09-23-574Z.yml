            - heading "What you get" [level=3] [ref=f29e1364]
            - list [ref=f29e1365]:
              - listitem [ref=f29e1366]: "A draft invoice: your name, the client, line items, taxable value, and CGST plus SGST or IGST if you are GST-registered and the client is in India."
              - listitem [ref=f29e1367]: The place of supply you entered, and a reverse-charge note if you turn that on. GST is then noted and not added to the balance.
              - listitem [ref=f29e1368]: Your UPI id or bank details on the draft.
              - listitem [ref=f29e1369]: "Three messages: with the invoice, about 7 days later, and about 14 days later."
              - listitem [ref=f29e1370]: A print view. Use the browser’s print dialog and choose “Save as PDF” if you want a file.
          - generic [ref=f29e1371]:
