      - region "Calculated in the browser." [ref=f29e2668]:
        - paragraph [ref=f29e2669]: How it works
        - heading "Calculated in the browser." [level=2] [ref=f29e2670]
        - list [ref=f29e2671]:
          - listitem [ref=f29e2672]: The draft is calculated on this page from what you type. The figures are not uploaded.
          - listitem [ref=f29e2673]: "GST is added only if you say you are registered and the client is in India. Same state: CGST and SGST. Different states: IGST."
          - listitem [ref=f29e2674]: If you are not registered, the draft does not add GST. If the client is outside India, it does not add GST, and it tells you to confirm export treatment with a chartered accountant.
          - listitem [ref=f29e2675]: Advance Receipt does not run that calculation.
          - listitem [ref=f29e2676]: Print uses the browser. Choose “Save as PDF” there if you want a file.
          - listitem [ref=f29e2677]: "The UPI link is assembled here: payee saividyut2@okicici, payee name Invoice Pack or Advance Receipt, amount 499 or 399, and the same order reference in both tn and tr. The QR code is that link."
          - listitem [ref=f29e2678]: A UTR you submit is stored in this browser as payment_pending. This page cannot mark an order paid.
          - listitem [ref=f29e2679]: This is not an e-invoice and not tax advice. There is no IRN, and nothing is filed on the GST portal.
      - region "What has happened so far." [ref=f29e2680]:
        - paragraph [ref=f29e2681]: Customer discovery
        - heading "What has happened so far." [level=2] [ref=f29e2682]
        - generic [ref=f29e2683]:
          - paragraph [ref=f29e2684]: Invoice Pack is an experiment for freelancers in India who need to bill one finished job. It is not a chartered accountant, not a law firm, and not a studio. This page does not claim an office, a team, a registration, customers, revenue, or reviews.
          - paragraph [ref=f29e2685]: Collected payments are the only score. No payment has been verified. The ledger is zero.
          - paragraph [ref=f29e2686]: Notes about Invoice Pack went out. Two people replied and were shown the draft format. One declined. One address bounced. No one has paid. The people who were written to are not listed here.
          - paragraph [ref=f29e2687]: Advance Receipt, at ₹399, is a second offer. It was started on 20 November 2026 because another way to collect payment was asked for while those replies were still open. It does not change the ₹499 invoice pack.
