          - heading "Peffle" [level=2] [ref=f32e111]
          - paragraph [ref=f32e112]: Solo · Library & CLI
          - paragraph [ref=f32e113]: Local kill switch, spend cap, and human-approval gate for agent tool calls — enforced when the handler runs, not in the system prompt. Policy rules, daily budgets, and a SQLite ledger live in your process; the CLI approves pending charges and MCP exposes the same guard to agent runtimes.
          - generic [ref=f32e114]:
            - paragraph [ref=f32e115]: Outcome
            - paragraph [ref=f32e116]: Stop the agent before it spends your money.
          - paragraph [ref=f32e117]: peffle.guard() wraps handlers. Policy and ledger stay in-process. No SaaS. No telemetry.
          - paragraph [ref=f32e118]: Published on npm. Enforcement runs entirely in your process.
